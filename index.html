<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Finder</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>🎥 Movie Finder</h1>
        <p class="tagline">Discover movies, find details, and read reviews!</p>

        <div class="search-bar">
            <input type="text" id="movie-input" placeholder="Enter movie name...">
            <button onclick="fetchMovieDetails()">Search</button>
        </div>

        <div id="movie-details" class="movie-details hidden">
            <div class="movie-header">
                <img id="movie-poster" alt="Movie Poster">
                <div>
                    <h2 id="movie-title"></h2>
                    <p id="movie-release-date"></p>
                </div>
            </div>
            <p id="movie-overview"></p>
            <div class="review-section">
                <h3>Top Review:</h3>
                <p id="movie-review"></p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
